<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>작업조건 관리</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#18212b; --sub:#5d6b7a; --line:#d9e0e7;
  --pri:#1f3a5f; --pri2:#2c5aa0; --acc:#e8f0fb; --warn:#b3541e; --chg:#fff1c2; --ok:#1f7a4d; --err:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;cursor:pointer}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px}
main{max-width:1100px;margin:0 auto;padding:12px 16px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 180px}
label{display:block;font-size:13px;color:var(--sub)}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px}
textarea{min-height:80px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--pri2);color:#fff;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:var(--acc);color:var(--pri)}
.btn.danger{background:#fde8e6;color:var(--err)}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:16px}
.muted{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-color:var(--pri);font-weight:700}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.pitem{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}
.pitem b{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.kv div span{display:block;font-size:12px;color:var(--sub)}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:15px;margin:14px 0 6px;color:var(--pri)}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.g{border-collapse:collapse;font-size:14px;min-width:100%}
table.g th,table.g td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.g th{background:#f0f3f7;font-weight:600;color:#33414f}
table.g td.chg{background:var(--chg);font-weight:700}
table.g td small{display:block;font-weight:400;color:var(--warn);font-size:11px}
table.g input{width:64px;min-height:34px;padding:4px;text-align:center}
.singles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.single{border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.single span{display:block;font-size:12px;color:var(--sub)}
.single.chg{background:var(--chg)}
.single small{color:var(--warn);font-size:11px}
.single input{width:100%;min-height:34px;padding:4px 6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#dde3ea;cursor:pointer;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tag{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:5px;padding:1px 5px}
.tl{border-left:3px solid var(--acc);margin-left:6px;padding-left:12px}
.tli{position:relative;margin-bottom:14px}
.tli:before{content:"";position:absolute;left:-19px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--pri2)}
.tli .head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;background:var(--acc);color:var(--pri);border-radius:6px;padding:1px 7px}
.badge.m{background:#eef7f1;color:var(--ok)}
.note{white-space:pre-wrap;background:#fbfaf6;border:1px solid #eee6cc;border-radius:8px;padding:8px 10px;margin:6px 0}
.reclist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column}
.viewer .vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}
.viewer img{max-width:100%;max-height:100%}
.viewer.zoom img{max-width:none;max-height:none}
.viewer .vbar{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));color:#fff;align-items:center}
.viewer .vbar button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:10px 14px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:15;overflow:auto;padding:16px 0}
.modal .card{max-width:860px;margin:0 auto}
.newph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.newph .it{border:1px solid var(--line);border-radius:8px;padding:4px;background:#fafbfc}
.newph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.newph select{width:100%;min-height:34px;padding:4px;margin-top:4px}
.newph .x{width:100%;margin-top:4px;min-height:32px;padding:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#18212b;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
.hide{display:none!important}
details>summary{cursor:pointer;font-weight:600;color:var(--pri);padding:6px 0}
.empty{padding:20px;text-align:center;color:var(--sub)}
.search{width:100%}
.pitem.none{opacity:.65;border-style:dashed}
.pick{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin-top:6px}
.pick button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}
.pick button.on{border-color:var(--pri2);background:var(--acc)}
table.g input.ai,.single input.ai{background:#e3f0ff;border-color:#8bb4e8}
.aibox{background:#eef5ff;border:1px solid #c7dbf5;border-radius:10px;padding:10px 12px;margin-top:8px}
.ocrtag{font-size:11px;color:var(--pri2)}
table.s{border-collapse:collapse;font-size:13px;width:100%}
table.s td,table.s th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
table.s td.v{text-align:right;font-weight:600;white-space:nowrap}
.catrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
@media (max-width:600px){ main{padding:10px 10px 100px} .card{padding:12px} }
</style>
</head>
<body>
<header>
  <h1 id="home">🏭 작업조건 관리</h1>
  <button id="catBtn" title="거래처별 제품 목록">제품목록</button>
  <button id="reload" title="새로고침">↻</button>
</header>
<main id="app"><div class="empty">불러오는 중…</div></main>
<button class="btn fab hide" id="fab">＋ 기록 추가</button>
<div id="modal" class="modal hide"></div>
<div id="viewer" class="viewer hide"></div>
<div id="toast" class="toast hide"></div>

<script>
// ───────── 호기별 조건 양식 ─────────
// 키 이름은 기존 엑셀 열 이름과 같게 맞춤
const range = (a, b) => { const r = []; if (a <= b) for (let i = a; i <= b; i++) r.push(i); else for (let i = a; i >= b; i--) r.push(i); return r; };

const TEMPLATES = {
  A: {
    name: '1~3호기 양식',
    grids: [
      { title: '사출 속도 (mm/s)', cols: range(1, 10), rows: [{ label: '속도', keys: range(1, 10).map(i => '사출속도' + i) }] },
      { title: '보압 (bar)', cols: range(1, 10), rows: [{ label: '보압', keys: range(1, 10).map(i => '보압' + i) }] },
      { title: '계량', cols: range(1, 5), rows: [
        { label: '스크류 회전 (%)', keys: range(1, 5).map(i => '스크류회전' + i) },
        { label: '배압 (bar)', keys: range(1, 5).map(i => '배압' + i) } ] },
      { title: '온도 (℃)', cols: ['노즐1', '실2', '실3', '실4', '실5'], rows: [{ label: '온도', keys: ['노즐1', '실2', '실3', '실4', '실5'] }] },
    ],
    singles: [['사출압력', 'bar'], ['보압시간', 's'], ['냉각시간', 's'], ['계량스트로크', 'mm']],
  },
  B: {
    name: '4~6호기 양식 (Selex)',
    grids: [
      { title: '형개', cols: range(1, 5), rows: [
        { label: 'SP (%)', keys: range(1, 5).map(i => `형개 SP${i}(%)`) },
        { label: 'PR (bar)', keys: range(1, 5).map(i => `형개 PR${i}(bar)`) },
        { label: 'POS (mm)', keys: range(1, 4).map(i => `형개 POS${i}(mm)`).concat(['']) } ] },
      { title: '형폐', cols: range(5, 1), rows: [
        { label: 'SP (%)', keys: range(5, 1).map(i => `형폐 SP${i}(%)`) },
        { label: 'PR (bar)', keys: range(5, 1).map(i => `형폐 PR${i}(bar)`) },
        { label: 'POS (mm)', keys: range(5, 1).map(i => `형폐 POS${i}(mm)`) } ] },
      { title: '사출', cols: range(4, 1), rows: [
        { label: 'SP (%)', keys: range(4, 1).map(i => `사출 SP${i}(%)`) },
        { label: 'PR (bar)', keys: range(4, 1).map(i => `사출 PR${i}(bar)`) },
        { label: 'POS (mm)', keys: range(4, 1).map(i => `사출 POS${i}(mm)`) } ] },
      { title: '보압', cols: ['3H', '2H', '1H'], rows: [
        { label: 'SP (%)', keys: [3, 2, 1].map(i => `보압 SP${i}H(%)`) },
        { label: 'PR (bar)', keys: [3, 2, 1].map(i => `보압 PR${i}H(bar)`) },
        { label: 'TIME (s)', keys: [3, 2, 1].map(i => `보압 TIME${i}H(s)`) } ] },
      { title: '계량', cols: ['1C', '2C', '3C', '4C'], rows: [
        { label: 'SP (%)', keys: range(1, 4).map(i => `계량 SP${i}C(%)`) },
        { label: 'PR (bar)', keys: range(1, 4).map(i => `계량 PR${i}C(bar)`) },
        { label: '배압 BP (%)', keys: range(1, 4).map(i => `계량 BP${i}C(%)`) },
        { label: 'POS (mm)', keys: range(1, 4).map(i => `계량 POS${i}C(mm)`) } ] },
      { title: '석백 (2S)', cols: ['POS (mm)', 'SP (%)', 'PR (bar)'], rows: [
        { label: '2S', keys: ['계량 POS2S(mm)', '계량 SP2S(%)', '계량 PR2S(bar)'] } ] },
      { title: '노즐', cols: ['SP (%)', 'PR (bar)', 'POS (mm)'], rows: [
        { label: '전진', keys: ['노즐전진 SP(%)', '노즐전진 PR(bar)', '노즐전진 POS(mm)'] },
        { label: '후진', keys: ['노즐후진 SP(%)', '노즐후진 PR(bar)', '노즐후진 POS(mm)'] } ] },
      { title: '형조정 / 저속', cols: ['SP (%)', 'PR (bar)'], rows: [
        { label: '형조정 후진', keys: ['형조정후진 SP(%)', '형조정후진 PR(bar)'] },
        { label: '형조정 전진', keys: ['형조정전진 SP(%)', '형조정전진 PR(bar)'] },
        { label: '형개 저속', keys: ['형개저속 SP(%)', '형개저속 PR(bar)'] },
        { label: '형폐 저속', keys: ['형폐저속 SP(%)', '형폐저속 PR(bar)'] } ] },
      { title: '에젝터', cols: ['SP (%)', 'PR (bar)', 'POS (mm)'], rows: [
        { label: '전진1', keys: ['에젝터전진1 SP(%)', '에젝터전진1 PR(bar)', '에젝터전진1 POS(mm)'] },
        { label: '전진2', keys: ['에젝터전진2 SP(%)', '에젝터전진2 PR(bar)', '에젝터전진2 POS(mm)'] },
        { label: '후진2', keys: ['에젝터후진2 SP(%)', '에젝터후진2 PR(bar)', '에젝터후진2 POS(mm)'] },
        { label: '후진1', keys: ['에젝터후진1 SP(%)', '에젝터후진1 PR(bar)', '에젝터후진1 POS(mm)'] } ] },
      { title: '히터 (℃)', cols: ['EN', 'NZ', '1', '2', '3', '4'], rows: [
        { label: '온도', keys: ['히터 EN(℃)', '히터 NZ(℃)', '히터1(℃)', '히터2(℃)', '히터3(℃)', '히터4(℃)'] } ] },
    ],
    singles: [['사출시간(s)'], ['냉각시간(s)'], ['형폐시간(s)'], ['형개시간(s)'], ['에젝터횟수'], ['에젝터전진지연(s)'], ['에젝터후진지연(s)'],
              ['사이클시간(s)'], ['실제 사출시간 (s)'], ['계량시간(s)']],
  },
};
const MACHINES = ['1', '2', '3', '4', '5', '6'];
const templateFor = m => (parseInt(m, 10) >= 4 ? 'B' : 'A');
const PHOTO_TAGS = ['작업조건', '금형', '제품', '원료', '불량', '기타'];
const singleKey = s => s[0];
const singleLabel = s => s[1] ? `${s[0]} (${s[1]})` : s[0];
const templateKeys = t => TEMPLATES[t].grids.flatMap(g => g.rows.flatMap(r => r.keys)).filter(Boolean).concat(TEMPLATES[t].singles.map(singleKey));

// ───────── 상태 ─────────
let RECORDS = [];
let CATALOG = { customers: [] }; // 거래처별 제품 목록 [{name, products:[{code,name,note}]}]
const S = { view: '', customer: '', product: '', tab: 'cond', recId: '', photoTag: '', q: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const photoUrl = p => '/api/photo?p=' + encodeURIComponent(p);
const keyOf = r => r.customer + '\u0001' + r.product;

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hide'), ms);
}
async function api(url, opt = {}) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', ...opt });
  if (r.status === 401) { showLogin(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('오류 ' + r.status));
  return j;
}

// ───────── URL 상태 (뒤로가기 지원) ─────────
function pushState() {
  const p = new URLSearchParams();
  if (S.view) p.set('v', S.view);
  if (S.customer) p.set('c', S.customer);
  if (S.product) p.set('p', S.product);
  if (S.tab !== 'cond') p.set('t', S.tab);
  if (S.recId) p.set('r', S.recId);
  const u = location.pathname + (p.toString() ? '?' + p : '');
  if (u !== location.pathname + location.search) history.pushState(null, '', u);
}
function readState() {
  const p = new URLSearchParams(location.search);
  S.view = p.get('v') || ''; S.customer = p.get('c') || ''; S.product = p.get('p') || ''; S.tab = p.get('t') || 'cond'; S.recId = p.get('r') || '';
}
window.addEventListener('popstate', () => { readState(); render(); });

// ───────── 로그인 ─────────
function showLogin() {
  $('#fab').classList.add('hide');
  $('#app').innerHTML = `<div class="card" style="max-width:360px;margin:40px auto">
    <h2>비밀번호 입력</h2><p class="muted">공장 공용 비밀번호를 입력하세요. 이 기기에서는 1년 동안 기억합니다.</p>
    <form id="lf"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" style="width:100%" placeholder="비밀번호">
    <button class="btn" style="width:100%;margin-top:10px">들어가기</button></form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { await api('/api/login', { method: 'POST', body: JSON.stringify({ pin: $('#pin').value }) }); load(); }
    catch (err) { if (err.message !== 'login') toast(err.message); }
  };
  $('#pin').focus();
}

async function load() {
  try {
    const [j, cat] = await Promise.all([api('/api/records'), api('/api/catalog')]);
    RECORDS = j.records || [];
    CATALOG = cat.customers ? cat : { customers: [] };
    $('#fab').classList.remove('hide');
    render();
  } catch (e) { if (e.message !== 'login') $('#app').innerHTML = `<div class="card empty">불러오기 실패: ${esc(e.message)}</div>`; }
}

// ───────── 데이터 묶기 ─────────
// 제품 = 제품 목록(맵핑)에 있는 것 + 기록에만 있는 것
const pidOf = p => p.code || p.name;
const catCustomer = name => CATALOG.customers.find(c => c.name === name);
function products() {
  const m = new Map();
  for (const c of CATALOG.customers) for (const p of c.products) {
    const id = pidOf(p);
    m.set(c.name + '\u0001' + id, { customer: c.name, product: id, productName: p.code ? p.name : '', recs: [], inCatalog: true });
  }
  for (const r of RECORDS) {
    const k = keyOf(r);
    if (!m.has(k)) m.set(k, { customer: r.customer, product: r.product, productName: '', recs: [], inCatalog: false });
    const p = m.get(k); p.recs.push(r);
    if (!p.productName && r.productName) p.productName = r.productName;
  }
  return [...m.values()];
}
const customers = () => [...new Set(CATALOG.customers.map(c => c.name).concat(RECORDS.map(r => r.customer)))].sort((a, b) => a.localeCompare(b, 'ko'));
const sortRecs = rs => rs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
const lastDate = p => p.recs.length ? sortRecs(p.recs)[0].date || '' : '';
const matchQ = (p, q) => !q || (p.customer + ' ' + p.product + ' ' + p.productName).toLowerCase().replace(/\s+/g, '').includes(q.toLowerCase().replace(/\s+/g, ''));
const hasParams = r => (r.params && r.params.values && Object.keys(r.params.values).length) || (r.screens || []).some(s => s.items && s.items.length);

// ───────── 화면 ─────────
function render() {
  window.scrollTo({ top: 0 });
  $('#fab').classList.toggle('hide', S.view === 'catalog');
  if (S.view === 'catalog') return renderCatalog();
  if (S.customer && S.product) return renderProduct();
  renderHome();
}

function pitem(p) {
  const rs = sortRecs(p.recs);
  const machines = [...new Set(rs.map(r => r.machine).filter(Boolean))].sort().map(m => m + '호기').join(', ');
  const nPh = rs.reduce((n, r) => n + (r.photos || []).length, 0);
  return `<button class="pitem ${rs.length ? '' : 'none'}" data-c="${esc(p.customer)}" data-p="${esc(p.product)}">
    <span class="muted">${esc(p.customer)}</span><b>${esc(p.product)}${p.productName ? ' · ' + esc(p.productName) : ''}</b>

        <div><span>최근 원료</span>${esc(lastOf('material'))}</div>

    </div>

function condView(condRecs) {
  if (!condRecs.length) return `<div class="card empty">아직 수치로 입력된 작업조건이 없습니다.<br>사진 탭에서 조건 사진을 확인하거나, ＋ 기록 추가에서 수치를 입력하세요.</div>`;
  const cur = condRecs.find(r => r.id === S.recId) || condRecs[0];
  const tpl = cur.params.template || templateFor(cur.machine);
  const prev = condRecs.slice(condRecs.indexOf(cur) + 1).find(r => (r.params.template || templateFor(r.machine)) === tpl);
  const pv = prev ? prev.params.values : null;

  return `
    <div class="card">
      <label>조건 기록 선택 (최신순)</label>
      <div class="reclist" style="margin-top:6px">
        ${condRecs.map(r => `<button class="chip ${r === cur ? 'on' : ''}" data-rec="${esc(r.id)}">${esc(r.date)} · ${esc(r.machine || '?')}호기</button>`).join('')}
      </div>
      <div class="kv" style="margin-top:10px">
        <div><span>날짜 / 호기</span>${esc(cur.date)} / ${esc(cur.machine || '-')}호기</div>
        <div><span>원료</span>${esc(cur.material || '-')}</div>
        <div><span>금형번호</span>${esc(cur.mold || '-')}</div>
        <div><span>작업자</span>${esc(cur.worker || '-')}</div>
      </div>
      ${cur.notes ? `<div class="note">${esc(cur.notes)}</div>` : ''}
      ${prev ? `<p class="muted">노란 칸 = 이전 기록(${esc(prev.date)} ${esc(prev.machine)}호기)과 달라진 값, 아래 작은 글씨가 이전 값</p>` : ''}
      ${paramTables(TEMPLATES[tpl], cur.params.values, pv)}

        <button class="btn ghost" data-edit="${esc(cur.id)}">수정</button>
      </div>
    </div>`;
}

function paramTables(T, vals, pv, editable) {
  const cell = k => {
    if (!k) return '<td></td>';
    const v = vals[k] ?? '';
    if (editable) return `<td><input data-k="${esc(k)}" value="${esc(v)}" inputmode="decimal"></td>`;
    const changed = pv && (pv[k] ?? '') !== v;
    return `<td class="${changed ? 'chg' : ''}">${esc(v || '·')}${changed ? `<small>${esc(pv[k] ?? '없음')}</small>` : ''}</td>`;
  };
  const grids = T.grids.map(g => {
    if (!editable && !g.rows.some(r => r.keys.some(k => k && vals[k]))) return '';
    return `<h3>${esc(g.title)}</h3><div class="grid-wrap"><table class="g">
      <tr><th></th>${g.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${g.rows.map(r => `<tr><th>${esc(r.label)}</th>${r.keys.map(cell).join('')}</tr>`).join('')}
    </table></div>`;
  }).join('');
  const singles = T.singles.filter(s => editable || vals[singleKey(s)]).map(s => {
    const k = singleKey(s), v = vals[k] ?? '';
    if (editable) return `<div class="single"><span>${esc(singleLabel(s))}</span><input data-k="${esc(k)}" value="${esc(v)}" inputmode="decimal"></div>`;
    const changed = pv && (pv[k] ?? '') !== v;
    return `<div class="single ${changed ? 'chg' : ''}"><span>${esc(singleLabel(s))}</span><b>${esc(v)}</b>${changed ? ` <small>이전 ${esc(pv[k] ?? '없음')}</small>` : ''}</div>`;
  }).join('');
  // 양식에 없는 값(예전 양식 등)도 버리지 않고 표시
  const known = new Set(T.grids.flatMap(g => g.rows.flatMap(r => r.keys)).concat(T.singles.map(singleKey)));
  const extra = editable ? '' : Object.keys(vals).filter(k => !known.has(k)).map(k =>
    `<div class="single"><span>${esc(k)}</span><b>${esc(vals[k])}</b></div>`).join('');
  return grids + (singles || extra ? `<h3>시간·기타</h3><div class="singles">${singles}${extra}</div>` : '');
}

// 사진에서 읽은 화면 값 전체(양식 칸에 없는 값 포함)
function screensView(rec, open) {
  const ss = (rec.screens || []).filter(s => s.items && s.items.length);
  if (!ss.length) return '';
  const n = ss.reduce((a, s) => a + s.items.length, 0);
  return `<details ${open ? 'open' : ''} style="margin-top:10px"><summary>사진에서 읽은 화면 값 전체 (${ss.length}개 화면, ${n}개 값)</summary>
    ${ss.map(s => `<h3>${esc(s.title || '화면')}${s.photo ? ` <button class="chip" data-ph1="${esc(s.photo)}">사진</button>` : ''}</h3>
      <table class="s">${s.items.map(i => `<tr><td>${esc(i.label)}</td><td class="muted">${esc(i.code)}</td><td class="v">${esc(i.value)} ${esc(i.unit)}</td></tr>`).join('')}</table>`).join('')}
  </details>`;
}

function thumbs(list) {
  return `<div class="thumbs">${list.map((p, i) => `<button class="thumb" data-ph="${esc(p.path)}" data-i="${i}">
    <img loading="lazy" src="${photoUrl(p.path)}" alt="">${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ''}</button>`).join('')}</div>`;
}

function photoView(photos) {
  const tags = [...new Set(photos.map(p => p.tag || '기타'))];
  const list = photos.filter(p => !S.photoTag || (p.tag || '기타') === S.photoTag);
  if (!photos.length) return `<div class="card empty">사진이 없습니다.</div>`;
  // 기록별로 묶어서 표시
  const groups = [];
  for (const p of list) { const g = groups.find(g => g.rec === p.rec); if (g) g.ps.push(p); else groups.push({ rec: p.rec, ps: [p] }); }
  return `<div class="card">
    <div class="chips"><button class="chip ${!S.photoTag ? 'on' : ''}" data-tag="">전체</button>
      ${tags.map(t => `<button class="chip ${S.photoTag === t ? 'on' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    ${groups.map(g => `<h3>${esc(g.rec.date)} · ${esc(g.rec.machine || '?')}호기 ${g.rec.material ? '· ' + esc(g.rec.material) : ''}</h3>${thumbs(g.ps)}`).join('')}
  </div>`;
}

function logView(rs) {
  return `<div class="card"><div class="tl">${rs.map(r => `

function bindCommon(root) {
  root.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => { S.recId = b.dataset.rec; if (b.dataset.goto) S.tab = b.dataset.goto; pushState(); renderProduct(); });
  root.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { S.photoTag = b.dataset.tag; renderProduct(); });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm({ edit: RECORDS.find(r => r.id === b.dataset.edit) }));
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => openForm({ copy: RECORDS.find(r => r.id === b.dataset.copy) }));
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const r = RECORDS.find(x => x.id === b.dataset.del);
    if (!confirm(`${r.date} ${r.machine}호기 기록과 사진 ${(r.photos || []).length}장을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try { await api('/api/records?id=' + encodeURIComponent(r.id), { method: 'DELETE' }); RECORDS = RECORDS.filter(x => x !== r); toast('삭제했습니다'); render(); }
    catch (e) { toast(e.message); }
  });
  root.querySelectorAll('[data-ph1]').forEach(b => b.onclick = e => { e.preventDefault(); openViewer([b.dataset.ph1], 0); });
  root.querySelectorAll('.thumb').forEach(b => b.onclick = () => {
    const all = [...root.querySelectorAll('.thumb')].map(x => x.dataset.ph);
    openViewer(all, all.indexOf(b.dataset.ph));
  });
}

// ───────── 거래처별 제품 목록(맵핑) 관리 ─────────
// 엑셀에서 [제품코드, 제품명] 두 열을 복사해 붙여 넣으면 한 줄에 한 제품으로 저장
function parseLines(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const cols = (l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.split(/\s{2,}/)).map(s => s.trim());
    return { code: cols[0] || '', name: cols.slice(1).filter(Boolean).join(' '), note: '' };
  }).filter(p => p.code || p.name);
}
const toLines = ps => ps.map(p => [p.code, p.name].filter(Boolean).join('\t')).join('\n');
async function saveCatalog(next) {
  const j = await api('/api/catalog', { method: 'POST', body: JSON.stringify(next) });
  CATALOG = j; return j;
}

function renderCatalog() {
  $('#fab').classList.add('hide');
  const cs = customers();
  const cur = S.customer;
  const c = catCustomer(cur) || { name: cur, products: [] };
  const recOnly = cur ? [...new Set(RECORDS.filter(r => r.customer === cur).map(r => r.product))]
    .filter(id => !c.products.some(p => pidOf(p) === id)) : [];
  $('#app').innerHTML = `
    <div class="card">
      <h2>거래처별 제품 목록</h2>
      <p class="muted">여기에 넣은 제품만 거래처를 골랐을 때 목록에 나옵니다. 엑셀에서 <b>제품코드 · 제품명</b> 두 열을 복사해 붙여 넣으세요.</p>
      <label>거래처</label>
      <div class="chips" style="margin:6px 0 10px">
        ${cs.map(x => `<button class="chip ${x === cur ? 'on' : ''}" data-cc="${esc(x)}">${esc(x)} <span class="muted">${(catCustomer(x) || { products: [] }).products.length}</span></button>`).join('')}
      </div>
      <div class="row"><label>새 거래처 추가<input id="newCust" placeholder="거래처 이름"></label><button class="btn ghost" id="addCust">추가</button></div>
    </div>
    ${cur ? `<div class="card">
      <h3 style="margin-top:0">${esc(cur)} 제품 ${c.products.length}개</h3>
      <textarea id="catText" style="width:100%;min-height:260px;font-family:monospace" placeholder="20901526&#9;케이스 상판&#10;20901527&#9;케이스 하판">${esc(toLines(c.products))}</textarea>
      <p class="muted">한 줄에 한 제품: 제품코드 [탭] 제품명. 코드가 없으면 제품명만 적어도 됩니다.</p>
      ${recOnly.length ? `<div class="aibox">기록은 있지만 목록에 없는 제품: ${recOnly.map(esc).join(', ')}
        <button class="btn ghost" id="addRecOnly" style="margin-left:6px">목록에 넣기</button></div>` : ''}
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <button class="btn danger" id="delCust">이 거래처 목록 비우기</button>
        <button class="btn" id="saveCat">저장</button>
      </div>
    </div>` : '<div class="card empty">거래처를 고르거나 새로 추가하세요.</div>'}
    <button class="btn ghost" id="backHome">← 처음 화면</button>`;

  document.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => { S.customer = b.dataset.cc; pushState(); renderCatalog(); });
  $('#backHome').onclick = () => { S.view = ''; S.customer = ''; pushState(); $('#fab').classList.remove('hide'); render(); };
  $('#addCust').onclick = () => {
    const n = $('#newCust').value.trim(); if (!n) return;
    S.customer = n; pushState(); renderCatalog();
  };
  if (!cur) return;
  const others = CATALOG.customers.filter(x => x.name !== cur);
  $('#saveCat').onclick = async () => {
    const ps = parseLines($('#catText').value);
    try { await saveCatalog({ customers: others.concat(ps.length ? [{ name: cur, products: ps }] : []) }); toast(`${cur} 제품 ${ps.length}개 저장했습니다`); renderCatalog(); }
    catch (e) { if (e.message !== 'login') toast('저장 실패: ' + e.message); }
  };
  $('#delCust').onclick = async () => {
    if (!confirm(`${cur}의 제품 목록을 비울까요? (작업 기록은 지워지지 않습니다)`)) return;
    try { await saveCatalog({ customers: others }); toast('비웠습니다'); renderCatalog(); } catch (e) { toast(e.message); }
  };
  const addBtn = $('#addRecOnly');
  if (addBtn) addBtn.onclick = () => {
    const t = $('#catText'); t.value = (t.value.trim() ? t.value.trim() + '\n' : '') + recOnly.join('\n'); toast('아래 저장을 눌러 주세요');
  };
}

// ───────── 사진 크게 보기 ─────────
function openViewer(list, i) {
  const v = $('#viewer');
  const show = () => {
    v.innerHTML = `<div class="vimg"><img src="${photoUrl(list[i])}"></div>
      <div class="vbar"><button id="vx">닫기</button><button id="vp">◀</button><span>${i + 1} / ${list.length}</span><button id="vn">▶</button>
      <button id="vz">확대</button><a href="${photoUrl(list[i])}" target="_blank" style="color:#fff;margin-left:auto">원본</a></div>`;
    $('#vx').onclick = () => { v.classList.add('hide'); v.classList.remove('zoom'); };
    $('#vp').onclick = () => { i = (i - 1 + list.length) % list.length; show(); };
    $('#vn').onclick = () => { i = (i + 1) % list.length; show(); };
    $('#vz').onclick = () => v.classList.toggle('zoom');
  };
  v.classList.remove('hide'); show();
}
document.addEventListener('keydown', e => {
  if ($('#viewer').classList.contains('hide')) return;
  if (e.key === 'Escape') $('#vx').click(); if (e.key === 'ArrowLeft') $('#vp').click(); if (e.key === 'ArrowRight') $('#vn').click();
});

// ───────── 기록 추가/수정 ─────────
function openForm({ edit, copy } = {}) {
  const base = edit || copy || {};
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const F = {
    id: edit ? edit.id : '',
    date: edit ? edit.date : today,
    machine: base.machine || '',
    customer: base.customer || S.customer || '',
    product: base.product || S.product || '',
    productName: base.productName || '',
    material: base.material || '',
    mold: base.mold || '',
    worker: edit ? edit.worker || '' : localStorageGet('worker'),
    notes: edit ? edit.notes || '' : '',
    photos: edit ? (edit.photos || []).map(p => ({ ...p })) : [],
    values: { ...((base.params && base.params.values) || {}) },
    screens: edit ? (edit.screens || []).map(s => ({ ...s })) : [],
  };
  if (!edit && !copy && F.customer && F.product) {
    const last = sortRecs(RECORDS.filter(r => r.customer === F.customer && r.product === F.product))[0];
    if (last) { F.machine = last.machine || ''; F.material = last.material || ''; F.mold = last.mold || ''; F.productName = last.productName || ''; }
  }
  if (!F.productName) { const cp = products().find(p => p.customer === F.customer && p.product === F.product); if (cp) F.productName = cp.productName; }
  const newPhotos = []; // 아직 안 올린 사진 {dataUrl, tag, w, h}
  const aiKeys = new Set(); // 사진에서 읽어 채운 칸
  const readDone = new Set(F.screens.map(s => s.photo)); // 이미 읽은 사진
  let busy = null; // 진행 중인 사진 올리기/읽기
  let closed = false;
  const m = $('#modal');

  m.innerHTML = `<div class="card">
    <h2>${edit ? '기록 수정' : '기록 추가'}</h2>
    <div class="row">
      <label>날짜<input type="date" id="fDate" value="${esc(F.date)}"></label>
      <label>작업자<input id="fWorker" value="${esc(F.worker)}" placeholder="이름"></label>
    </div>
    <label style="margin-top:8px">호기</label>
    <div class="chips" id="fMach" style="margin:4px 0 8px">${MACHINES.map(x => `<button type="button" class="chip ${F.machine === x ? 'on' : ''}" data-m="${x}">${x}호기</button>`).join('')}</div>
    <div class="row">
      <label>거래처 *<input id="fCust" list="dlC" value="${esc(F.customer)}" placeholder="예: 리드앤플레이" autocomplete="off"></label>
      <label>제품코드 / 제품 *<input id="fProd" value="${esc(F.product)}" placeholder="코드나 이름 일부 입력" autocomplete="off"></label>
    </div>
    <div class="pick" id="fPick"></div>
    <label style="margin-top:8px">제품명 (선택)<input id="fPName" value="${esc(F.productName)}" placeholder="제품 목록에 있으면 자동으로 채워집니다"></label>
    <datalist id="dlC">${customers().map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <div class="row" style="margin-top:8px">
      <label>원료명<input id="fMat" list="dlM" value="${esc(F.material)}" placeholder="예: ABS LG121H"></label>
      <label>금형번호<input id="fMold" value="${esc(F.mold)}" placeholder="예: 2603"></label>
    </div>
    <datalist id="dlM">${[...new Set(RECORDS.map(r => r.material).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <label style="margin-top:8px">특이사항<textarea id="fNotes" placeholder="불량, 조정 내용, 주의할 점 등">${esc(F.notes)}</textarea></label>

    <h3>사진</h3>
    <div class="row">
      <button type="button" class="btn ghost" id="fCam">📷 카메라로 찍기</button>
      <button type="button" class="btn ghost" id="fAlb">🖼 앨범에서 고르기</button>
      <input type="file" id="fileCam" accept="image/*" capture="environment" multiple class="hide">
      <input type="file" id="fileAlb" accept="image/*" multiple class="hide">
    </div>
    <p class="muted">설비 화면 사진은 '작업조건'으로 두면 자동으로 값을 읽어 아래 표에 채웁니다. 금형·제품·원료 사진은 종류를 바꿔 주세요.</p>
    <div class="newph" id="fPh"></div>
    <div class="aibox hide" id="fAi"></div>

    <details id="fParDet" ${Object.keys(F.values).length ? 'open' : ''} style="margin-top:12px">
      <summary>작업조건 수치 (사진에서 자동 입력 · 직접 수정 가능)</summary>
      <div class="row" style="margin:6px 0"><button type="button" class="btn ghost" id="fLoadPrev">이 제품의 최근 조건 불러오기</button>
        <button type="button" class="btn ghost" id="fClear">모두 지우기</button></div>
      <p class="muted" id="fTplName"></p>
      <div id="fPar"></div>
      <div id="fScr"></div>
    </details>

    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <span class="muted" id="fStatus" style="flex:1"></span>
      <button type="button" class="btn ghost" id="fCancel">취소</button>
      <button type="button" class="btn" id="fSave">저장</button>
    </div>
  </div>`;
  m.classList.remove('hide');
  m.scrollTop = 0;
  const status = t => { if (!closed) $('#fStatus').textContent = t; };

  // ── 제품 고르기: 거래처의 제품 목록에서 검색 ──
  const renderPick = () => {
    const c = $('#fCust').value.trim(), q = $('#fProd').value.trim();
    const list = products().filter(p => p.customer === c && matchQ(p, q));
    const exact = list.find(p => p.product === q);
    const box = $('#fPick');
    if (!c || (exact && list.length === 1) || !list.length) { box.innerHTML = c && !list.length && q ? '<span class="muted">목록에 없는 제품입니다. 그대로 저장하면 새 제품으로 기록됩니다.</span>' : ''; return; }
    list.sort((a, b) => (!!b.recs.length - !!a.recs.length) || a.product.localeCompare(b.product, 'ko', { numeric: true }));
    box.innerHTML = list.slice(0, 30).map(p => `<button type="button" class="${p.product === q ? 'on' : ''}" data-pp="${esc(p.product)}" data-pn="${esc(p.productName)}">
      <b>${esc(p.product)}</b>${p.productName ? ' · ' + esc(p.productName) : ''} <span class="muted">${p.recs.length ? '기록 ' + p.recs.length : ''}</span></button>`).join('') +
      (list.length > 30 ? `<span class="muted">${list.length - 30}개 더 있음 — 더 입력해서 좁혀 주세요</span>` : '');
    box.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => {
      $('#fProd').value = b.dataset.pp; if (b.dataset.pn) $('#fPName').value = b.dataset.pn;
      const last = sortRecs(RECORDS.filter(r => r.customer === c && r.product === b.dataset.pp))[0];
      if (last && !edit) {
        if (!$('#fMat').value) $('#fMat').value = last.material || '';
        if (!$('#fMold').value) $('#fMold').value = last.mold || '';
      }
      renderPick();
    });
  };
  $('#fCust').oninput = renderPick;
  $('#fProd').oninput = renderPick;
  renderPick();

  // ── 조건 표 ──
  const collectValues = () => { $('#fPar').querySelectorAll('input[data-k]').forEach(i => { F.values[i.dataset.k] = i.value.trim(); }); };
  const renderPar = () => {
    const tpl = templateFor(F.machine || '1');
    $('#fTplName').textContent = F.machine ? `${F.machine}호기 → ${TEMPLATES[tpl].name}. 파란 칸 = 사진에서 읽은 값(확인해 주세요)` : '호기를 먼저 고르면 해당 양식이 나옵니다 (지금은 1~3호기 양식)';
    $('#fPar').innerHTML = paramTables(TEMPLATES[tpl], F.values, null, true);
    $('#fPar').querySelectorAll('input[data-k]').forEach(i => {
      if (aiKeys.has(i.dataset.k)) i.classList.add('ai');
      i.addEventListener('input', () => { aiKeys.delete(i.dataset.k); i.classList.remove('ai'); });
    });
    $('#fScr').innerHTML = screensView({ screens: F.screens }, false);
    bindCommon($('#fScr'));
  };
  renderPar();

  $('#fMach').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    collectValues(); F.machine = b.dataset.m;
    $('#fMach').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    renderPar();
    kick(); // 호기를 고르기 전에 넣은 사진도 이제 읽기
  });
  $('#fLoadPrev').onclick = () => {
    collectValues();
    const c = $('#fCust').value.trim(), p = $('#fProd').value.trim(), tpl = templateFor(F.machine || '1');
    const prev = sortRecs(RECORDS.filter(r => r.customer === c && r.product === p && r.params && Object.keys(r.params.values || {}).length && (r.params.template || templateFor(r.machine)) === tpl && r.id !== F.id))[0];
    if (!prev) return toast('같은 양식의 이전 조건이 없습니다');
    // 사진에서 읽은 칸은 그대로 두고 빈 칸만 채움
    for (const [k, v] of Object.entries(prev.params.values)) if (!F.values[k]) F.values[k] = v;
    renderPar(); toast(`${prev.date} ${prev.machine}호기 조건으로 빈 칸을 채웠습니다`);
  };
  $('#fClear').onclick = () => { F.values = {}; aiKeys.clear(); renderPar(); };

  // ── 사진 목록 ──
  const renderPh = () => {
    if (closed) return;
    const box = $('#fPh');
    const badge = p => p.path ? (readDone.has(p.path) ? '<span class="ocrtag">✔ 읽음</span>' : '') : '<span class="ocrtag">올리기 전</span>';
    box.innerHTML = F.photos.map((p, i) => phItem(photoUrl(p.path), p.tag, 'o' + i, badge(p))).join('') +
      newPhotos.map((p, i) => phItem(p.dataUrl, p.tag, 'n' + i, badge(p))).join('');
    box.querySelectorAll('select').forEach(s => s.onchange = () => {
      const [t, i] = [s.dataset.id[0], +s.dataset.id.slice(1)]; (t === 'o' ? F.photos : newPhotos)[i].tag = s.value; kick();
    });
    box.querySelectorAll('.x').forEach(b => b.onclick = () => {
      const [t, i] = [b.dataset.id[0], +b.dataset.id.slice(1)];
      const arr = t === 'o' ? F.photos : newPhotos; const [rm] = arr.splice(i, 1);
      if (rm && rm.path) F.screens = F.screens.filter(s => s.photo !== rm.path);
      renderPh(); renderPar();
    });
  };
  const phItem = (src, tag, id, badge) => `<div class="it"><img src="${src}">${badge}<select data-id="${id}">${PHOTO_TAGS.map(t => `<option ${t === tag ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <button type="button" class="btn danger x" data-id="${id}">빼기</button></div>`;
  renderPh();

  // ── 사진 올리기 + 화면 값 읽기 (자동) ──
  const showAi = html => { if (closed) return; const b = $('#fAi'); b.classList.toggle('hide', !html); b.innerHTML = html || ''; };
  async function uploadPending() {
    while (newPhotos.length) {
      const p = newPhotos[0];
      status(`사진 올리는 중… (남은 ${newPhotos.length}장)`);
      const j = await api('/api/photo', { method: 'POST', body: JSON.stringify({ data: p.dataUrl }) });
      newPhotos.shift();
      F.photos.push({ path: j.path, tag: p.tag, w: p.w, h: p.h, fresh: true });
      renderPh();
    }
  }
  async function readPhotos(paths) {
    const tpl = templateFor(F.machine);
    const keys = templateKeys(tpl);
    let done = 0, filled = 0, failed = 0;
    const queue = paths.slice();
    showAi(`🤖 사진에서 작업조건 읽는 중… 0 / ${paths.length}장 (장당 10~30초)`);
    const worker = async () => {
      while (queue.length) {
        const path = queue.shift();
        try {
          const j = await api('/api/ocr', { method: 'POST', body: JSON.stringify({ path, machine: F.machine, keys }) });
          const r = j.result;
          readDone.add(path);
          F.screens = F.screens.filter(s => s.photo !== path).concat([{ photo: path, title: r.screen_title, time: r.screen_time, items: r.items }]);
          collectValues();
          for (const { key, value } of r.mapped) { F.values[key] = value; aiKeys.add(key); filled++; }
          if (r.mold_number && !$('#fMold').value.trim()) $('#fMold').value = r.mold_number;
          const ph = F.photos.find(p => p.path === path);
          if (ph && r.photo_kind && r.photo_kind !== '조건화면' && PHOTO_TAGS.includes(r.photo_kind)) ph.tag = r.photo_kind;
          if (!closed) { renderPar(); renderPh(); }
        } catch (e) {
          if (e.message === 'login') throw e;
          failed++; readDone.add(path); // 같은 사진을 계속 다시 시도하지 않음
          if (/키/.test(e.message)) { queue.length = 0; showAi('⚠ ' + esc(e.message)); return; }
        }
        done++;
        showAi(`🤖 사진에서 작업조건 읽는 중… ${done} / ${paths.length}장`);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (!closed && !$('#fAi').textContent.startsWith('⚠')) {
      $('#fParDet').open = true;
      showAi(`🤖 ${paths.length}장 읽음 · 양식 칸 ${filled}개 채움${failed ? ` · ${failed}장 실패` : ''}. 파란 칸이 사진에서 읽은 값입니다. 틀린 값은 고쳐 주세요.`);
    }
  }
  // 새로 넣은 사진을 올리고, '작업조건' 사진 중 안 읽은 것을 읽음. 이미 진행 중이면 끝난 뒤 한 번 더 확인.
  function kick() {
    if (busy) { busy.job.again = true; return busy; }
    const job = { again: false };
    const run = (async () => {
      try {
        do {
          job.again = false;
          await uploadPending();
          if (!F.machine) { if (F.photos.some(p => p.tag === '작업조건' && !readDone.has(p.path))) showAi('호기를 고르면 사진에서 작업조건을 읽습니다.'); continue; }
          const todo = F.photos.filter(p => p.fresh && p.tag === '작업조건' && !readDone.has(p.path)).map(p => p.path);
          if (todo.length) await readPhotos(todo);
        } while (job.again);
      } finally { busy = null; status(''); }
    })();
    run.job = job;
    busy = run;
    run.catch(e => { if (e.message !== 'login') toast('사진 처리 실패: ' + e.message, 4000); });
    return run;
  }
  // 예전 기록의 사진은 자동으로 읽지 않고 버튼으로
  const oldUnread = () => F.photos.filter(p => !p.fresh && p.tag === '작업조건' && !readDone.has(p.path));
  if (edit && oldUnread().length) {
    showAi(`이 기록의 '작업조건' 사진 ${oldUnread().length}장은 아직 읽지 않았습니다. <button type="button" class="btn ghost" id="fReadOld">사진에서 값 읽기</button>`);
    $('#fReadOld').onclick = () => {
      if (!F.machine) return toast('호기를 먼저 골라 주세요');
      oldUnread().forEach(p => { p.fresh = true; });
      kick();
    };
  }

  const addFiles = async files => {
    status('사진 줄이는 중…');
    for (const f of files) {
      try { const r = await shrink(f); newPhotos.push({ ...r, tag: newPhotos.at(-1)?.tag || F.photos.at(-1)?.tag || '작업조건' }); }
      catch { toast('사진을 읽지 못했습니다: ' + f.name); }
    }
    status(''); renderPh(); kick();
  };
  $('#fCam').onclick = () => $('#fileCam').click();
  $('#fAlb').onclick = () => $('#fileAlb').click();
  $('#fileCam').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
  $('#fileAlb').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };

  const close = () => { closed = true; m.classList.add('hide'); m.innerHTML = ''; };
  $('#fCancel').onclick = () => {
    if ((newPhotos.length || F.photos.some(p => p.fresh)) && !confirm('저장하지 않은 사진이 있습니다. 닫을까요?')) return;
    close();
  };

  $('#fSave').onclick = async () => {
    const rec = {
      id: F.id || undefined,
      date: $('#fDate').value, machine: F.machine, customer: $('#fCust').value.trim(), product: $('#fProd').value.trim(),
      productName: $('#fPName').value.trim(), material: $('#fMat').value.trim(), mold: $('#fMold').value.trim(),
      worker: $('#fWorker').value.trim(), notes: $('#fNotes').value.trim(),
    };
    if (!rec.customer || !rec.product) return toast('거래처와 제품코드를 입력하세요');
    if (!rec.machine && !confirm('호기를 고르지 않았습니다. 그대로 저장할까요?')) return;
    localStorageSet('worker', rec.worker);
    const btn = $('#fSave'); btn.disabled = true;
    try {
      if (busy || newPhotos.length) { status('사진 처리가 끝나면 저장합니다…'); await (busy || kick()); }
      if (busy) await busy;
      collectValues();
      const vals = Object.fromEntries(Object.entries(F.values).filter(([, v]) => v !== ''));
      rec.params = { template: templateFor(rec.machine || '1'), values: vals };
      rec.photos = F.photos.map(({ fresh, ...p }) => p);
      rec.screens = F.screens;
      status('저장 중…');
      const j = await api('/api/records', { method: 'POST', body: JSON.stringify(rec) });
      RECORDS = RECORDS.filter(r => r.id !== j.record.id).concat([j.record]);
      close();
      S.view = ''; S.customer = j.record.customer; S.product = j.record.product;
      S.tab = hasParams(j.record) ? 'cond' : 'log'; S.recId = j.record.id;
      pushState(); render(); toast('저장했습니다');
    } catch (e) {
      status(''); btn.disabled = false;
      if (e.message !== 'login') toast('저장 실패: ' + e.message + ' (다시 저장을 눌러 주세요)', 4000);
    }
  };
}

// 휴대폰 사진을 긴 변 1800px JPEG로 줄임
async function shrink(file) {
  const MAX = 1800;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    bmp = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(file); });
  }
  const w0 = bmp.width, h0 = bmp.height, s = Math.min(1, MAX / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return { dataUrl: c.toDataURL('image/jpeg', 0.82), w, h };
}
function localStorageGet(k) { try { return localStorage.getItem('wc_' + k) || ''; } catch { return ''; } }
function localStorageSet(k, v) { try { localStorage.setItem('wc_' + k, v); } catch {} }

$('#fab').onclick = () => openForm();
$('#home').onclick = () => { S.view = ''; S.customer = ''; S.product = ''; S.recId = ''; S.tab = 'cond'; S.q = ''; $('#fab').classList.remove('hide'); pushState(); render(); };
$('#catBtn').onclick = () => { S.view = 'catalog'; S.product = ''; pushState(); render(); };
$('#reload').onclick = () => load();
readState();
load();
</script>
</body>
